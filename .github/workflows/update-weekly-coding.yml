name: Update weekly coding

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"   # 00:30 KST every day

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate weekly coding card
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python scripts/generate_weekly_coding.py

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/weekly-coding.svg
          git diff --cached --quiet || git commit -m "Update weekly coding"
          git push
